name: LiteCast
options:
  bundleIdPrefix: com.dwimnofan
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ARCHS: arm64
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
targets:
  LiteCast:
    type: application
    platform: macOS
    sources: [LiteCast]
    info:
      path: LiteCast/Info.plist
      properties:
        CFBundleDisplayName: LiteCast
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSMinimumSystemVersion: "14.0"
        NSHumanReadableCopyright: ""
        NSAppleEventsUsageDescription: "LiteCast reads and controls Music and Spotify to show Now Playing in the notch."
    entitlements:
      path: LiteCast/LiteCast.entitlements
      properties:
        com.apple.security.automation.apple-events: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwimnofan.litecast
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        # shortcut: no App Sandbox yet; decide with distribution plan (blueprint §2)
        ENABLE_APP_SANDBOX: NO
  LiteCastCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources: [Tests/LiteCastCoreTests]
    dependencies:
      - target: LiteCast
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.dwimnofan.litecast.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  LiteCast:
    build:
      targets:
        LiteCast: all
        LiteCastCoreTests: [test]
    test:
      targets: [LiteCastCoreTests]
